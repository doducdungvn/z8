<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>☆ Lucky Wheel ☆</title>
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="html2canvas.min.js"></script>
  <style>
    /* === BỐ CỤC CHUNG & TỐI GIẢN CHUYÊN NGHIỆP === */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 15px;
      line-height: 1.5;
    }

    .main-wrapper {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .container {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 18px;
      display: flex;
      gap: 20px;
    }

    /* === KHU VỰC NHẬP LIỆU BÊN TRÁI === */
    .left-column {
      flex: 1.1;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-section {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .input-section label {
      font-weight: 600;
      font-size: 13px;
      color: #374151;
    }

    textarea {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      background-color: #ffffff;
      color: #111827;
    }

    textarea:focus,
    input[type="text"]:focus {
      outline: none;
      border-color: #4b5563;
    }

    #numbers {
      height: 220px;
    }

    #twentySevenNumbers {
      height: 70px;
    }

    #shortcuts {
      height: 85px;
    }

    /* === CÁC NÚT BẤM (GỌN GÀNG, TRUNG TÍNH) === */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    button {
      background-color: #374151;
      color: #ffffff;
      border: 1px solid #1f2937;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 3px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    button:hover {
      background-color: #1f2937;
    }

    .retain-box {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      margin-top: 5px;
      background: #f3f4f6;
      padding: 6px 10px;
      border-radius: 3px;
      border: 1px solid #e5e7eb;
    }

    #retainNumber {
      width: 60px;
      padding: 4px 6px;
      font-size: 13px;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      text-align: center;
    }

    .footer-links {
      font-size: 12px;
      color: #6b7280;
      margin-top: 5px;
    }

    .footer-links a {
      color: #4b5563;
      text-decoration: none;
    }

    .footer-links a:hover {
      text-decoration: underline;
    }

    /* === KHU VỰC KẾT QUẢ BÊN PHẢI === */
    .right-section {
      flex: 1.9;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .summary-badge-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f3f4f6;
      border: 1px solid #e5e7eb;
      padding: 8px 14px;
      border-radius: 3px;
      font-size: 13px;
      font-weight: 600;
    }

    .results-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 12px;
      flex: 1;
    }

    .result-section {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 3px;
      display: flex;
      flex-direction: column;
      height: 440px;
    }

    .result-header {
      background: #f3f4f6;
      border-bottom: 1px solid #d1d5db;
      padding: 8px 10px;
      font-weight: 600;
      font-size: 13px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .result-body {
      padding: 10px;
      overflow-y: auto;
      flex: 1;
      font-size: 13px;
      font-family: "Consolas", "Courier New", monospace;
    }

    .red-text {
      color: #b91c1c;
      font-weight: 700;
    }

    .matching-number {
      color: #b91c1c;
      font-weight: 700;
    }

    .details-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .details-list li {
      padding: 4px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    /* === BẢNG TÍNH TIỀN CƯỢC & THANH TOÁN (CHUYÊN NGHIỆP, KHÔNG MÀU MÈ) === */
    .calc-container {
      background: #ffffff;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 18px;
    }

    .calc-layout {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .calc-table-wrap {
      flex: 1;
    }

    .pro-table {
      width: 100%;
      border-collapse: collapse;
      border: 1px solid #9ca3af;
      font-size: 13px;
      background: #ffffff;
    }

    .pro-table th,
    .pro-table td {
      border: 1px solid #9ca3af;
      padding: 6px 10px;
      text-align: center;
      vertical-align: middle;
    }

    .pro-table th {
      background-color: #f3f4f6;
      font-weight: 600;
      color: #111827;
      height: 34px;
    }

    .pro-table .cell-label {
      font-weight: 600;
      background-color: #fafafa;
      width: 110px;
    }

    .table-input {
      width: 80px;
      height: 28px;
      border: 1px solid #cbd5e1;
      border-radius: 2px;
      text-align: center;
      font-size: 13px;
      font-family: inherit;
    }

    .col-num {
      text-align: right;
      padding-right: 14px !important;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 13px;
      font-weight: 500;
    }

    .col-center {
      text-align: center;
      font-family: "Consolas", "Courier New", monospace;
      font-size: 14px;
      font-weight: 600;
    }

    .row-summary {
      background-color: #f9fafb;
      font-weight: 600;
    }

    .row-final {
      background-color: #f3f4f6;
      font-weight: 700;
    }

    /* Cài đặt giá (Đ, L, X, C) */
    .rate-card {
      width: 220px;
      border: 1px solid #9ca3af;
      border-radius: 3px;
      background: #ffffff;
    }

    .rate-card-header {
      background: #f3f4f6;
      border-bottom: 1px solid #9ca3af;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 13px;
      text-align: center;
    }

    .rate-card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rate-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }

    .rate-row label {
      width: 25px;
      font-weight: 600;
    }

    .rate-input {
      width: 90px;
      height: 28px;
      border: 1px solid #cbd5e1;
      border-radius: 2px;
      text-align: center;
      font-size: 13px;
      font-family: inherit;
    }

    .rate-card-footer {
      padding: 10px 12px;
      border-top: 1px solid #9ca3af;
      background: #f9fafb;
    }

    .btn-copy-image {
      width: 100%;
      background-color: #1f2937;
      color: #ffffff;
      border: 1px solid #111827;
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 3px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }

    .btn-copy-image:hover {
      background-color: #111827;
    }

    .btn-copy-image:disabled {
      background-color: #9ca3af;
      cursor: not-allowed;
    }

    @media (max-width: 900px) {
      .container,
      .calc-layout {
        flex-direction: column;
      }

      .results-grid {
        grid-template-columns: 1fr;
      }

      .result-section {
        height: 280px;
      }

      .rate-card {
        width: 100%;
      }

      .rate-card-body {
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-between;
      }
    }
  </style>
</head>

<body>
  <div class="main-wrapper">

    <!-- KHU VỰC 1: NHẬP LIỆU VÀ PHÂN TÍCH KẾT QUẢ -->
    <div class="container">
      <!-- Cột trái: Nhập số -->
      <div class="left-column">
        <div class="input-section">
          <label for="numbers">Nhập số:</label>
          <textarea id="numbers" rows="6"></textarea>
        </div>

        <div class="button-group">
          <button type="button" id="normalizeButton">Chuẩn hóa 27</button>
          <button type="button" id="calculateButton">Tính tổng</button>
          <button type="button" id="copyButton">Sao chép Chuyển</button>
          <button type="button" id="copyInputListButton">Sao chép Input</button>
        </div>

        <div class="retain-box">
          <label for="retainNumber">Giữ lại:</label>
          <input type="text" id="retainNumber" value="0">
          <label><input type="radio" name="retainType" id="retainTypeMoney" value="money" checked> Tiền</label>
          <label><input type="radio" name="retainType" id="retainTypePercentage" value="percentage"> Phần trăm</label>
        </div>

        <div class="input-section">
          <label for="twentySevenNumbers">27 giải:</label>
          <textarea id="twentySevenNumbers" rows="3"></textarea>
        </div>

        <div class="input-section">
          <label for="shortcuts"><a href="nhaptat.html">Nhập tắt:</a></label>
          <textarea id="shortcuts" rows="3"></textarea>
        </div>

        <div class="footer-links">
          <a href="dothuong.html">copyright</a> © by <a href="ex.html">Angle</a>
        </div>
      </div>

      <!-- Cột phải: 3 cột kết quả -->
      <div class="right-section">
        <div class="summary-badge-bar">
          <div><u>Tất cả:</u> <span id="numResults">0 con</span></div>
          <div id="totalSum2"></div>
        </div>

        <div class="results-grid">
          <!-- Cột 1: Kết quả -->
          <div class="result-section">
            <div class="result-header">
              <span>Kết quả:</span>
              <span id="totalSum" class="red-text">0</span>
            </div>
            <div class="result-body" id="result"></div>
          </div>

          <!-- Cột 2: Chuyển -->
          <div class="result-section">
            <div class="result-header">
              <span>Chuyển:</span>
              <span id="modifiedTotalSum" class="red-text">0</span>
            </div>
            <div class="result-body">
              <div id="modifiedResult"></div>
              <div id="totalSum3"></div>
            </div>
          </div>

          <!-- Cột 3: Chi tiết -->
          <div class="result-section">
            <div class="result-header">
              <span>Chi tiết:</span>
            </div>
            <div class="result-body">
              <ul id="inputList" class="details-list"></ul>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- KHU VỰC 2: BẢNG TÍNH TIỀN CƯỢC & THANH TOÁN (CHÍNH XÁC, KHÔNG LÀM TRÒN) -->
    <div class="calc-container">
      <div class="calc-layout">
        <!-- Bảng tính cược -->
        <div class="calc-table-wrap">
          <table class="pro-table">
            <thead>
              <tr>
                <th style="width: 15%;"></th>
                <th style="width: 20%;">Cược</th>
                <th style="width: 25%;">Tiền</th>
                <th style="width: 25%;">Tiền Trúng</th>
                <th style="width: 15%;">Trúng</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td class="cell-label">Đ</td>
                <td><input type="text" class="table-input" id="input1" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(1)" /></td>
                <td class="col-num"><span id="result1">0</span></td>
                <td class="col-num"><span id="bonusResult1">0</span></td>
                <td><input type="text" class="table-input" id="bonus1" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(1)" /></td>
              </tr>
              <tr>
                <td class="cell-label">L</td>
                <td><input type="text" class="table-input" id="input2" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(2)" /></td>
                <td class="col-num"><span id="result2">0</span></td>
                <td class="col-num"><span id="bonusResult2">0</span></td>
                <td><input type="text" class="table-input" id="bonus2" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(2)" /></td>
              </tr>
              <tr>
                <td class="cell-label">X</td>
                <td><input type="text" class="table-input" id="input3" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(3)" /></td>
                <td class="col-num"><span id="result3">0</span></td>
                <td class="col-num"><span id="bonusResult3">0</span></td>
                <td><input type="text" class="table-input" id="bonus3" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(3)" /></td>
              </tr>
              <tr>
                <td class="cell-label">C</td>
                <td><input type="text" class="table-input" id="input4" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(4)" /></td>
                <td class="col-num"><span id="result4">0</span></td>
                <td class="col-num"><span id="bonusResult4">0</span></td>
                <td><input type="text" class="table-input" id="bonus4" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(4)" /></td>
              </tr>
              <tr class="row-summary">
                <td class="cell-label">Thầu</td>
                <td></td>
                <td class="col-num"><span id="total">0</span></td>
                <td class="col-num"><span id="bonusTotal">0</span></td>
                <td></td>
              </tr>
              <tr class="row-final">
                <td class="cell-label">Tổng thanh toán</td>
                <td></td>
                <td colspan="2" class="col-center"><span id="finalResult">0</span></td>
                <td></td>
              </tr>
            </tbody>
          </table>
        </div>

        <!-- Khung thiết lập giá / tỷ lệ Đ, L, X, C -->
        <div class="rate-card">
          <div class="rate-card-header">Cài đặt giá</div>
          <div class="rate-card-body">
            <div class="rate-row">
              <label for="percentage1">Đ:</label>
              <input type="text" class="rate-input" id="percentage1" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(1)" />
            </div>
            <div class="rate-row">
              <label for="percentage2">L:</label>
              <input type="text" class="rate-input" id="percentage2" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(2)" />
            </div>
            <div class="rate-row">
              <label for="percentage3">X:</label>
              <input type="text" class="rate-input" id="percentage3" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(3)" />
            </div>
            <div class="rate-row">
              <label for="percentage4">C:</label>
              <input type="text" class="rate-input" id="percentage4" value="0" onfocus="clearDefaultValue(this)" onblur="restoreDefaultValue(this)" oninput="calculateResult(4)" />
            </div>
          </div>
          <div class="rate-card-footer">
            <button type="button" id="copyTableImageBtn" class="btn-copy-image">📸 Copy ảnh gửi Zalo</button>
          </div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Định dạng số chuẩn xác, KHÔNG LÀM TRÒN THÀNH SỐ NGUYÊN, giữ phần thập phân chính xác
    function formatExact(num) {
      if (isNaN(num) || num === null || num === undefined) return "0";
      // Khắc phục sai số dấu phẩy động (float precision) đến 4 chữ số thập phân
      const cleanNum = Math.round((num + Number.EPSILON) * 10000) / 10000;
      return cleanNum.toString();
    }

    // Khởi tạo các giá trị mặc định cho bảng tính
    function initializeDefaultValues() {
      for (let i = 1; i <= 4; i++) {
        document.getElementById(`result${i}`).textContent = "0";
        document.getElementById(`bonusResult${i}`).textContent = "0";
      }
      document.getElementById('total').textContent = "0";
      document.getElementById('bonusTotal').textContent = "0";
      document.getElementById('finalResult').textContent = "0";
    }

    initializeDefaultValues();

    // Lưu và nạp Shortcuts
    function saveShortcuts() {
      var shortcutsInput = document.getElementById("shortcuts").value;
      localStorage.setItem("shortcutsData", shortcutsInput);
    }

    function convertInputFormat(input) {
      return input.replace(/,/g, '.');
    }

    function loadShortcuts() {
      var shortcutsData = localStorage.getItem("shortcutsData");
      if (shortcutsData) {
        document.getElementById("shortcuts").value = shortcutsData;
      }
    }

    loadShortcuts();

    var shortcutsTextarea = document.getElementById("shortcuts");
    shortcutsTextarea.addEventListener("input", saveShortcuts);

    function stripAccents(s) {
      if (!s) return "";
      let str = s.replace(/đ/g, "d").replace(/Đ/g, "D");
      str = str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return str;
    }

    // Nạp các từ viết tắt tùy chỉnh trong khung "Nhập tắt" (#shortcuts)
    function getCustomShortcuts() {
      const shortcutsEl = document.getElementById("shortcuts");
      const shortcutsInput = shortcutsEl ? shortcutsEl.value : "";
      const custom = {};
      if (!shortcutsInput.trim()) return custom;

      const lines = shortcutsInput.split("\n");
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line || line.startsWith("#") || line.indexOf("=") === -1) continue;
        const eqIdx = line.indexOf("=");
        const kPart = line.substring(0, eqIdx).trim().toLowerCase();
        const v = line.substring(eqIdx + 1).trim();
        if (kPart && v) {
          const keys = kPart.split(",");
          for (let j = 0; j < keys.length; j++) {
            const rawK = keys[j].trim().replace(/[’‘ʼ＇`]/g, "'");
            if (rawK) {
              custom[rawK] = v;
              const unacc = stripAccents(rawK);
              if (unacc) {
                custom[unacc] = v;
              }
            }
          }
        }
      }
      return custom;
    }

    // MỞ RỘNG ĐẶC BIỆT: Tách chữ x khi khách gõ sát (kép lệchx5, keplechx5, và tất cả từ khóa trong khung nhập tắt)
    function separateTightX(line, customShortcuts) {
      if (!line) return "";
      let res = line;

      // Danh sách từ khóa hệ thống cần tách sát chữ x
      const baseKeywords = [
        "kép lệch", "kep lech", "keplech", "kep lec", "keplec", "kl",
        "kép bằng", "kep bang", "kepbang", "kép", "kep", "lip", "k",
        "sát kép", "sat kep", "satkep", "áp kép", "ap kep", "apkep", "apk",
        "kép âm", "kep am", "kepam", "kepa",
        "chẵn chẵn", "chan chan", "chanchan", "chẵn lẻ", "chan le", "chanle",
        "lẻ chẵn", "le chan", "lechan", "lẻ lẻ", "le le", "lele",
        "đầu to", "dau to", "dauto", "đầu bé", "dau be", "daube",
        "đầu chẵn", "dau chan", "dauchan", "đầu lẻ", "dau le", "daule",
        "đít to", "đuôi to", "dit to", "duoi to", "ditto",
        "đít bé", "đuôi bé", "dit be", "duoi be", "ditbe",
        "đít chẵn", "đuôi chẵn", "dit chan", "duoi chan", "ditchan",
        "đít lẻ", "đuôi lẻ", "dit le", "duoi le", "ditle",
        "tổng to", "tong to", "tongto", "tổng bé", "tong be", "tongbe",
        "tổng chẵn", "tong chan", "tongchan", "tổng lẻ", "tong le", "tongle",
        "to to", "toto", "to bé", "to be", "tobe", "bé to", "be to", "beto", "bé bé", "be be", "bebe"
      ];

      // Thêm các từ khóa từ khung nhập tắt (customShortcuts)
      const customKeys = Object.keys(customShortcuts || {});
      const allKeysSet = new Set([...baseKeywords, ...customKeys]);
      const sortedKeys = Array.from(allKeysSet).filter(k => k && k.length > 0).sort((a, b) => b.length - a.length);

      for (let i = 0; i < sortedKeys.length; i++) {
        const k = sortedKeys[i];
        const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
        // Khớp: [ranh giới](từ_khóa)x[số tiền]
        const tightRegex = new RegExp('(^|[\\s,;.:\\-])(' + escaped + ')x(?=\\d)', 'gi');
        res = res.replace(tightRegex, '$1$2 x');
      }

      // Mở rộng các tiền tố chữ + số dính liền x (ví dụ: dau0x5, cham1x10, t0x20, bo01x50, he02x10)
      res = res.replace(/(^|[\s,;.:\-])(dau|đầu|dit|đít|duoi|đuôi|cham|chạm|c|tong|tổng|t|d|bo|bộ|b|he|hệ|h)(\d{1,2})x(?=\d)/gi, '$1$2$3 x');

      return res;
    }

    function normalizeShorthandToken(token, customShortcuts) {
      let t = stripAccents(token.trim().toLowerCase()).replace(/[’‘ʼ＇`]/g, "'");
      if (customShortcuts && customShortcuts[t]) return t;
      if (DEFAULT_SHORTHANDS[t]) return t;

      const dauditMatch = t.match(/^daudit(\d)$/);
      if (dauditMatch) {
        const d = dauditMatch[1];
        const dauKey = 'd' + d;
        const ditKey = "d'" + d;
        const dict = (customShortcuts && (customShortcuts[dauKey] || customShortcuts[ditKey])) ? customShortcuts : DEFAULT_SHORTHANDS;
        if (dict[dauKey] && dict[ditKey]) {
          return dict[dauKey] + '.' + dict[ditKey];
        }
      }

      const cMatch = t.match(/^c(\d)$/);
      if (cMatch) return 'cham' + cMatch[1];
      const dauMatch = t.match(/^dau(\d)$/);
      if (dauMatch) return 'd' + dauMatch[1];
      const ditMatch = t.match(/^(?:dit|duoi)(\d)$/);
      if (ditMatch) return "d'" + ditMatch[1];

      const heBoMatch = t.match(/^(?:he|bo|b|h)(\d{1,2})$/);
      if (heBoMatch) {
        let num = heBoMatch[1];
        if (num.length === 1) num = '0' + num;
        return 'h' + num;
      }

      const aliases = {
        'chanle': 'cl', 'lechan': 'lc', 'chanchan': 'cc', 'lele': 'll',
        'dc': 'dauchan', 'dl': 'daule', 'dt': 'dauto', 'dto': 'dauto', 'db': 'daube', 'dbe': 'daube', 'dle': 'daule',
        'tb': 'tobe', 'tt': 'toto', 'bt': 'beto', 'bb': 'bebe',
        'tc': 'tongchan', 'tl': 'tongle', 'tle': 'tongle', 'tto': 'tongto', 'tbe': 'tongbe',
        'chan': 'ditchan', 'le': 'ditle', 'duoichan': 'ditchan', 'duoile': 'ditle', 'duoibe': 'ditbe', 'duoito': 'ditto',
        "d'c": 'ditchan', "d'l": 'ditle',
        'keplech': 'kl', 'keplec': 'kl', 'apk': 'apkep', 'satkep': 'apkep', 'kepa': 'kepam',
        'lip': 'k', 'kep': 'k'
      };
      return aliases[t] || t;
    }

    function resolveShorthands(numbersString, customShortcuts, depth = 0) {
      let s = numbersString;

      // 1. Mở rộng các từ khóa có khoảng trắng trong customShortcuts trước
      const mwKeys = Object.keys(customShortcuts).filter(k => /\s/.test(k)).sort((a, b) => b.length - a.length);
      for (let i = 0; i < mwKeys.length; i++) {
        const k = mwKeys[i];
        const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+');
        const mwRegex = new RegExp('(^|[.,\\-\\s])' + escaped + '(?=[.,\\-\\s]|$)', 'gi');
        s = s.replace(mwRegex, (match, prefix) => prefix + customShortcuts[k]);
      }

      // 2. Mở rộng prefix nhiều số: dau0,8 -> dau0, dau8 hoặc c1,2,3 -> cham1, cham2, cham3
      const combinedRegex = /(dau|dit|daudit|d'|d|he|bo|b|h|t|cham|c)([0-9]{1,2})((?:[.,\-\s]+[0-9]{1,2})+)/gi;
      s = s.replace(combinedRegex, (match, rawPrefix, firstDigit, rest) => {
        const pLower = rawPrefix.toLowerCase();
        const normPrefix = pLower === 'c' ? 'cham' : ((pLower === 'b' || pLower === 'h') ? 'bo' : rawPrefix);
        const digits = rest.split(/[^0-9]+/).filter(Boolean);
        const expanded = [normPrefix + firstDigit, ...digits.map(d => normPrefix + d)];
        return expanded.join(',');
      });

      // 3. Tách từng token và phân giải
      const parts = s.split(/([.,\-\s]+)/);
      const resolvedParts = parts.map(part => {
        const trimmed = part.trim().toLowerCase().replace(/[’‘ʼ＇`]/g, "'");
        if (!trimmed) return part;
        if (customShortcuts[trimmed]) return customShortcuts[trimmed];
        const unaccented = stripAccents(trimmed);
        if (customShortcuts[unaccented]) return customShortcuts[unaccented];
        if (DEFAULT_SHORTHANDS[trimmed]) return DEFAULT_SHORTHANDS[trimmed];
        if (DEFAULT_SHORTHANDS[unaccented]) return DEFAULT_SHORTHANDS[unaccented];

        const normalized = normalizeShorthandToken(part, customShortcuts);
        if (customShortcuts[normalized]) return customShortcuts[normalized];
        if (DEFAULT_SHORTHANDS[normalized]) return DEFAULT_SHORTHANDS[normalized];
        if (/^[\d.]+$/.test(normalized)) return normalized;
        return part;
      });

      const resStr = resolvedParts.join('');
      // Hỗ trợ định nghĩa lồng nhau (nesting) tối đa 2 cấp
      if (depth < 2 && resStr !== numbersString && /[a-zA-Z]/.test(resStr)) {
        return resolveShorthands(resStr, customShortcuts, depth + 1);
      }
      return resStr;
    }

    function normalizeBetLine(line, customShortcuts) {

      let separated = separateTightX(line, customShortcuts);

      norm = norm.replace(/^(xienquay|xq|xienq|quay|q|xquay|lo\s*xien|l\s*xien|de|lo|xien|x|x2|x3|x4|3cang|3c|d|l|c|bc|cang|3\s*cang|bo|he)[.:;\-]+\s*/gi, '$1 ');

      norm = norm.replace(new RegExp('\\b(?:dit\\s+be|duoi\\s+be|ditbe)' + endB, 'g'), 'ditbe ');
      norm = norm.replace(new RegExp('\\b(?:dit\\s+chan|duoi\\s+chan|ditchan)' + endB, 'g'), 'ditchan ');
      norm = norm.replace(new RegExp('\\b(?:dit\\s+le|duoi\\s+le|ditle)' + endB, 'g'), 'ditle ');

      norm = norm.replace(new RegExp('\\b(?:tong\\s+be|tongbe)' + endB, 'g'), 'tongbe ');
      norm = norm.replace(new RegExp('\\b(?:tong\\s+chan|tongchan)' + endB, 'g'), 'tongchan ');
      norm = norm.replace(new RegExp('\\b(?:tong\\s+le|tongle)' + endB, 'g'), 'tongle ');
      norm = norm.replace(/\b(?:daudit|dau\s+dit|dau\s+duoi|dd|đđ)\s*(\d)(?![0-9])/g, 'daudit$1');
      norm = norm.replace(new RegExp('\\b(?:sat\\s*kep|satkep|ap\\s*kep|apkep|apk)' + endB, 'g'), 'apkep ');
      norm = norm.replace(new RegExp('\\b(?:kep\\s*am|kepam|kepa)' + endB, 'g'), 'kepam ');
      norm = norm.replace(new RegExp('\\b(?:kep\\s*lech|keplech|kep\\s*lec|keplec|kl)' + endB, 'g'), 'kl ');
      norm = norm.replace(new RegExp('\\b(?:kep\\s*bang|kepbang|lip|kep)' + endB, 'g'), 'k ');
      norm = norm.replace(/\b(?:dau)\s*(\d)(?![0-9])/g, 'dau$1');
      norm = norm.replace(/\b(?:dit|duoi)\s*(\d)(?![0-9])/g, 'dit$1');

      norm = norm.replace(/\b(?:c)\s*(\d)(?![0-9])/g, 'cham$1');

      norm = norm.replace(/\b(?:t)\s*(\d)(?![0-9])/g, 't$1');
      norm = norm.replace(/\b(?:bo|he)\s*(\d{1,2})(?![0-9])/g, 'bo$1');
      norm = norm.replace(/\b(?:moi\s*con\s*bang|moi\s*con)\b/g, 'mc');
      norm = norm.replace(/\b(?:3\s*cang|3\s*c)\b/g, '3c');
      norm = norm.replace(/\b(?:xien\s*quay|x\s*quay)\b/g, 'xq');
      norm = norm.replace(/\b(?:lo\s*xien|l\s*xien)\b/g, 'xien');
      norm = norm.replace(/((?:mỗi\s*con\s*=?|moi\s*con\s*=?|mc\s*=|mc|=\s*mc|=|\+|\*|x)\s*\d+(?:\.\d+)?)\s*[\.,;](?=[\s.,;\-\d]|$)/gi, '$1 ');
      norm = norm.replace(/\s*[,.]\s*(?==|x|mc|moi\s*con|\+|\*)/g, ' ');

      norm = norm.replace(/([a-z0-9])\s*(mỗi\s*con\s*=?|moi\s*con\s*=?|mc\s*=|mc|=\s*mc|=|\+|\*|x)\s*(\d+(?:\.\d+)?)(?:\s*(?:d|đ|₫|k|n)(?=[\s.,;\-\d]|$))?(?![a-z0-9])/gi, (m, p, rawOp, amt) => {
        const op = rawOp.includes('=') ? '=' : 'x';
        return p + op + amt;
      });
      norm = norm.replace(/\bmc\s*(\d+(?:\.\d+)?)(?:\s*(?:d|đ|₫|k|n)(?=[\s.,;\-\d]|$))?(?![a-z0-9])/gi, '=$1');
      norm = norm.replace(/\s+(\d+(?:\.\d+)?)\s*(?:d|đ|₫|k|n)(?![a-z0-9])/gi, ' =$1');

      return norm;
    }

    function expandMultiBets(text) {
      const HSPACE = '[^\\S\\r\\n]';
      const catChoices = 'lô|lo|l|đề|de|đê|đe|dê|dè|đè|đ|d|xienquay|xq|xienq|quay|xquay|xien|xiên|3cang|3càng|3c|bc';
      const catMap = {
        'lo': 'lo', 'lô': 'lo', 'l': 'lo',
        'de': 'de', 'đề': 'de', 'đê': 'de', 'đe': 'de', 'dê': 'de', 'dè': 'de', 'đè': 'de', 'd': 'de', 'đ': 'de',
        'xien': 'xien', 'xiên': 'xien',
        'xienquay': 'xienquay', 'xq': 'xienquay', 'xienq': 'xienquay', 'quay': 'xienquay', 'xquay': 'xienquay',
        '3cang': 'bacang', '3càng': 'bacang', '3c': 'bacang', 'bc': 'bacang'
      };

      const multiBetRegex = new RegExp(
        '(?:^|[\\r\\n;,]|' + HSPACE + '+)' +
        '(' + catChoices + ')' +
        '(?:' + HSPACE + '+|[.:;\\-])' +
        '([0-9.,\\-\\s_a-zA-Z\'’‘＇`]+?)' +
        '\\s*(x|\\*|=|\\+|mc|mỗi\\s*con\\s*=?|moi\\s*con\\s*=?)' +
        '\\s*(\\d+(?:\\.\\d+)?(?:k|d|n|đ|₫)?)\\.?' +
        '((?:' + HSPACE + '*[,;.:\\-]?' + HSPACE + '*(?:' + catChoices + ')(?:' + HSPACE + '*(?:x|\\*|=|\\+|mc|mỗi\\s*con\\s*=?|moi\\s*con\\s*=?)\\s*|' + HSPACE + '+)\\d+(?:\\.\\d+)?(?:k|d|n|đ|₫)?)+)' +
        '(?=[.,;:' + HSPACE + ']|$)',
        'gim'
      );

      const subClauseRegex = new RegExp(
        HSPACE + '*[,;.:\\-]?' + HSPACE + '*' +
        '(' + catChoices + ')' +
        '(?:' + HSPACE + '*(x|\\*|=|\\+|mc|mỗi\\s*con\\s*=?|moi\\s*con\\s*=?)\\s*|' + HSPACE + '+)' +
        '(\\d+(?:\\.\\d+)?(?:k|d|n|đ|₫)?)',
        'gi'
      );

      return text.replace(multiBetRegex, (match, cat1, nums, op1, amt1, rest) => {
        const c1Lower = cat1.trim().toLowerCase();
        const c1 = catMap[c1Lower] || c1Lower;
        const lines = [c1 + ' ' + nums.trim() + op1.trim() + amt1.trim()];

        let subMatch;
        subClauseRegex.lastIndex = 0;
        while ((subMatch = subClauseRegex.exec(rest)) !== null) {
          const cKLower = subMatch[1].trim().toLowerCase();
          const cK = catMap[cKLower] || cKLower;
          const opK = (subMatch[2] && subMatch[2].trim()) ? subMatch[2].trim() : 'x';
          const amtK = subMatch[3].trim();
          lines.push(cK + ' ' + nums.trim() + opK + amtK);
        }

        return '\n' + lines.join('\n') + '\n';
      });
    }

    // Phân tích dữ liệu nhập cược chuẩn 1:1 theo bet_parser.py
    function parseCombinedInput(inputStr, customShortcuts) {
      let processed = inputStr.replace(/[’‘ʼ＇`]/g, "'");
      processed = processed.replace(/\b(?:3\s*cang|3\s*càng|ba\s*cang|ba\s*càng|3\s*c)\b/gi, '3cang');

      // Tách từ khóa đứng liền số: de88 -> de 88
      const keywordRegex = /(^|[\s,;.])(xienquay|xquay|xienq|3cang|3càng|3\s*càng|3\s*cang|quay|xien|xiên|xq|de|đề|đê|đe|dê|dè|đè|Dè|Đè|dề|Dề|lo|lô|3c|bc|càng|cang|d(?!\d(?!\d))|đ(?!\d(?!\d))|l|c|q|x)(\d)/gi;
      processed = processed.replace(keywordRegex, "$1$2 $3");

      processed = expandMultiBets(processed);

      // Tách dòng nếu có danh mục mới trên cùng một dòng
      const sameLinePattern = /[\s,;.:\-]+(xienquay|xq|xienq|quay|q|xquay|lô\s*xiên|lo\s*xien|đề|de|đê|đe|dê|dè|đè|Dè|Đè|dề|Dề|lô|lo|l|xiên|xien|x2|x3|x4)(?=[\s.,;\-\d:]|$)|[\s,;.:\-]+(3càng|3cang|3\s*càng|3\s*cang|3c|bc|càng|cang)(?=[\s.,;\-\d:]|$)|[\s,;.:\-]+(d|đ|l|c)(?=[\s.,;\-\d:]|$)(?=\s+[a-z0-9'’‘＇`])/gi;
      processed = processed.replace(sameLinePattern, match => "\n" + match.replace(/^[\s,;.:\-]+/, '').trim());

      // Tách dòng sau mỗi cụm cược
      const betSplitRegex = /([a-z0-9])\s*((?:mỗi\s*con\s*=?|moi\s*con\s*=?|mc\s*=|mc|=\s*mc|=|\+|\*|x)\s*\d+(?:\.\d+)?(?:\s*(?:d|đ|₫|k|n)(?=[\s.,;\-\d]|$))?)\b[\s.,;\-]+(?=[^\s.,;\-])/gi;
      processed = processed.replace(betSplitRegex, '$1 $2\n');

      const lines = processed.split('\n');
      const parsedBets = {
        de: [],
        lo: [],
        xien2: [],
        xien3: [],
        xien4: [],
        bacang: [],
        invalid_items: []
      };

      const typeRegex = {
        de: /^(de|d)$/i,
        lo: /^(lo|l)$/i,
        xienquay: /^(xienquay|xq|xienq|quay|q|xquay)$/i,
        xien: /^(lo\s*xien|l\s*xien|xien|x|x2|x3|x4)$/i,
        bacang: /^(3cang|3c|c|bc|cang|3\s*cang)$/i
      };

      let activeCategory = 'de';

      for (let i = 0; i < lines.length; i++) {
        const origLine = lines[i].trim();
        if (!origLine) continue;

        let trimmed = normalizeBetLine(origLine, customShortcuts);
        let lineType = '';

        const mSpace = trimmed.match(/^(xienquay|xq|xienq|quay|q|xquay|lo\s*xien|l\s*xien|de|lo|xien|x2|x3|x4|3cang|3c|d|l|c|bc|cang|3\s*cang|bo|he)(?:\b|[.:;\-\s])\s*(.*)$/i);
        if (mSpace) {
          const rawT = mSpace[1].toLowerCase();
          if (typeRegex.de.test(rawT)) lineType = 'de';
          else if (typeRegex.lo.test(rawT)) lineType = 'lo';
          else if (typeRegex.xienquay.test(rawT)) lineType = 'xienquay';
          else if (typeRegex.xien.test(rawT)) lineType = 'xien';
          else if (typeRegex.bacang.test(rawT)) lineType = 'bacang';

          if (lineType) {
            activeCategory = lineType;
            trimmed = mSpace[2] ? mSpace[2].replace(/^[.:;\-\s]+/, '').trim() : '';
            if (!trimmed) continue;
          }
        }

        if (!lineType) lineType = activeCategory;

        // Bắt các cụm cược: [các số / từ khóa] [x / = / + / *] [số tiền]
        const groupRegex = /([a-wy-z0-9'’‘＇`.,\-\s]+)([x=+*])(\d+(?:\.\d+)?)/gi;
        let gMatch;
        let matchFound = false;

        while ((gMatch = groupRegex.exec(trimmed)) !== null) {
          matchFound = true;
          const rawNumStr = gMatch[1].trim();
          const amt = parseFloat(gMatch[3]);
          if (amt <= 0 || isNaN(amt)) continue;

          // Giải mã từ khóa
          const numStr = resolveShorthands(rawNumStr, customShortcuts);
          const rawTokens = numStr.split(/[.,\-\s]+/).filter(Boolean);
          const validNumbers = [];

          for (let k = 0; k < rawTokens.length; k++) {
            const tok = rawTokens[k];
            if (!/^\d+$/.test(tok)) {
              parsedBets.invalid_items.push(tok);
              continue;
            }

            if (lineType === 'de' || lineType === 'lo' || lineType === 'xien' || lineType === 'xienquay') {
              if (tok.length === 2) {
                validNumbers.push(tok);
              } else if (tok.length === 3 && tok[0] === tok[2]) {
                // Tách số đối xứng: 050 -> 05, 50 | 686 -> 68, 86
                validNumbers.push(tok.slice(0, 2));
                validNumbers.push(tok.slice(1, 3));
              } else {
                parsedBets.invalid_items.push(tok);
              }
            } else if (lineType === 'bacang') {
              if (tok.length === 3) {
                validNumbers.push(tok);
              } else {
                parsedBets.invalid_items.push(tok);
              }
            }
          }

          if (validNumbers.length === 0) continue;

          if (lineType === 'xien') {
            if (validNumbers.length >= 2 && validNumbers.length <= 4) {
              parsedBets[`xien${validNumbers.length}`].push({ numbers: validNumbers, amount: amt });
            } else {
              parsedBets.invalid_items.push(validNumbers.join('.'));
            }
          } else if (lineType === 'xienquay') {
            if (validNumbers.length >= 2) {
              const combos = (arr, k) => {
                if (k === 1) return arr.map(e => [e]);
                const result = [];
                for (let idx = 0; idx < arr.length; idx++) {
                  const head = arr[idx];
                  const tail = arr.slice(idx + 1);
                  combos(tail, k - 1).forEach(c => result.push([head, ...c]));
                }
                return result;
              };
              [2, 3, 4].forEach(kLen => {
                if (validNumbers.length >= kLen) {
                  combos(validNumbers, kLen).forEach(c => {
                    parsedBets[`xien${kLen}`].push({ numbers: c, amount: amt });
                  });
                }
              });
            }
          } else {
            for (let idx = 0; idx < validNumbers.length; idx++) {
              parsedBets[lineType].push({ number: validNumbers[idx], amount: amt });
            }
          }
        }

        if (!matchFound) {
          const cleanedCheck = origLine.replace(/^[.:;\-\s]+/, '').trim();
          if (cleanedCheck && !/^(de|đề|lo|lô|xien|xiên|3cang|3c|bc)$/i.test(cleanedCheck)) {
            parsedBets.invalid_items.push(origLine);
          }
        }
      }

      return parsedBets;
    }

    // TÍNH TỔNG SỐ CƯỢC & SO KHỚP KẾT QUẢ 27 GIẢI
    function calculateSum() {
      const numbersInput = document.getElementById("numbers").value;
      const customShortcuts = getCustomShortcuts();
      const parsedData = parseCombinedInput(numbersInput, customShortcuts);

      const sums = {};
      const processedNumbers = [];

      // 1. Tổng hợp cược Đề
      let sumDe = 0;
      parsedData.de.forEach(item => {
        sums[item.number] = (sums[item.number] || 0) + item.amount;
        sumDe += item.amount;
        processedNumbers.push({
          type: 'de',
          number: item.number,
          amount: item.amount,
          text: item.number + "x" + item.amount
        });
      });

      // 2. Tổng hợp cược Lô
      let sumLo = 0;
      parsedData.lo.forEach(item => {
        sums[item.number] = (sums[item.number] || 0) + item.amount;
        sumLo += item.amount;
        processedNumbers.push({
          type: 'lo',
          number: item.number,
          amount: item.amount,
          text: item.number + "x" + item.amount
        });
      });

      // 3. Tổng hợp 3 Càng
      let sum3C = 0;
      parsedData.bacang.forEach(item => {
        sums[item.number] = (sums[item.number] || 0) + item.amount;
        sum3C += item.amount;
        processedNumbers.push({
          type: 'bacang',
          number: item.number,
          amount: item.amount,
          text: item.number + "x" + item.amount
        });
      });

      // 4. Tổng hợp Xiên
      let sumXien = 0;
      ['xien2', 'xien3', 'xien4'].forEach(xKey => {
        parsedData[xKey].forEach(item => {
          const xStr = item.numbers.join('-');
          sums[xStr] = (sums[xStr] || 0) + item.amount;
          sumXien += item.amount;
          processedNumbers.push({
            type: 'xien',
            number: xStr,
            amount: item.amount,
            text: xStr + "x" + item.amount
          });
        });
      });

      // Hiển thị danh sách kết quả (sắp xếp theo tiền cược giảm dần)
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";
      const sortedSums = Object.entries(sums).sort((a, b) => b[1] - a[1]);
      sortedSums.forEach(([key, value]) => {
        const div = document.createElement("div");
        div.innerHTML = key + " = " + value;
        resultDiv.appendChild(div);
      });

      // So khớp với 27 giải
      const twentySevenNumbersInput = document.getElementById("twentySevenNumbers").value;
      const twentySevenNumbersArray = twentySevenNumbersInput.split(/\s+/).map(s => s.trim().toLowerCase()).filter(Boolean);
      const matchingNumbers = {};
      let matchingSum = 0;

      for (let i = 0; i < twentySevenNumbersArray.length; i++) {
        const number = twentySevenNumbersArray[i];
        if (sums.hasOwnProperty(number)) {
          matchingNumbers[number] = (matchingNumbers[number] || 0) + 1;
          matchingSum += sums[number];
        }
      }

      // Đánh dấu số trúng trên danh sách kết quả
      const resultDivs = resultDiv.getElementsByTagName("div");
      for (let i = 0; i < resultDivs.length; i++) {
        const resultNumber = resultDivs[i].textContent.split(" = ")[0].trim();
        if (matchingNumbers.hasOwnProperty(resultNumber)) {
          resultDivs[i].classList.add("matching-number");
          if (matchingNumbers[resultNumber] > 1) {
            resultDivs[i].textContent += " (" + matchingNumbers[resultNumber] + " nhay)";
          }
        }
      }

      // Cập nhật tổng tiền cược và tổng trúng
      const totalSum = Object.values(sums).reduce((a, b) => a + b, 0);
      let totalSumText = totalSum.toLocaleString("vi-VN");
      if (matchingSum > 0) {
        totalSumText = totalSumText + "/" + matchingSum.toLocaleString("vi-VN");
      }
      document.getElementById("totalSum").textContent = totalSumText;
      document.getElementById("numResults").textContent = sortedSums.length + " con";

      // Cập nhật danh sách Chi tiết (inputList)
      const inputList = document.getElementById("inputList");
      inputList.innerHTML = "";
      processedNumbers.forEach(item => {
        const li = document.createElement("li");
        li.textContent = item.text;
        const isMatch = (item.type === 'xien') ? false : twentySevenNumbersArray.includes(item.number);
        if (isMatch) {
          li.classList.add("matching-number");
        }
        inputList.appendChild(li);
      });

      // Xử lý giữ lại & Chuyển
      const retainNumber = document.getElementById("retainNumber").value;
      const retainNumberInt = parseFloat(retainNumber) || 0;
      const retainTypeEl = document.querySelector('input[name="retainType"]:checked');
      const retainType = retainTypeEl ? retainTypeEl.value : "money";
      let modifiedResultText = "";
      let modifiedTotalSum = 0;

      for (const key in sums) {
        if (sums.hasOwnProperty(key)) {
          let modifiedSum = 0;
          if (retainType === "money") {
            modifiedSum = sums[key] - retainNumberInt;
          } else if (retainType === "percentage") {
            const percentage = sums[key] * (retainNumberInt / 100);
            modifiedSum = sums[key] - percentage;
          }
          if (modifiedSum >= 1) {
            modifiedSum = Math.trunc(modifiedSum);
            modifiedResultText += key + "x" + modifiedSum + "<br>";
            modifiedTotalSum += modifiedSum;
          }
        }
      }
      document.getElementById("modifiedResult").innerHTML = modifiedResultText;
      document.getElementById("modifiedTotalSum").textContent = modifiedTotalSum.toLocaleString("vi-VN");

      // Tự động đồng bộ số tiền cược vào bảng tính tiền cược phía dưới nếu có phân loại
      if (sumDe > 0 || sumLo > 0 || sumXien > 0 || sum3C > 0) {
        if (sumDe > 0) document.getElementById("input1").value = sumDe;
        if (sumLo > 0) document.getElementById("input2").value = sumLo;
        if (sumXien > 0) document.getElementById("input3").value = sumXien;
        if (sum3C > 0) document.getElementById("input4").value = sum3C;
        for (let r = 1; r <= 4; r++) {
          calculateResult(r);
        }
      }
    }

    // Xử lý lại chi tiết các số khi cần
    function processInputNumbers() {
      // Đã được tích hợp trọn vẹn và đồng bộ 100% trong calculateSum()
    }

    // === TÍNH TOÁN BẢNG CƯỢC: CHÍNH XÁC, TUYỆT ĐỐI KHÔNG LÀM TRÒN SỐ NGUYÊN ===
    function calculateResult(row) {
      const input = parseFloat(document.getElementById(`input${row}`).value) || 0;
      const bonus = parseFloat(document.getElementById(`bonus${row}`).value) || 0;
      const percentageInput = document.getElementById(`percentage${row}`).value;
      const percentage = parseFloat(percentageInput) || 0;

      let result = 0;
      let bonusResult = 0;

      if (row === 3 || row === 4) {
        // X, C: tính theo tỷ lệ trực tiếp
        result = (input * percentage) / 100;
        bonusResult = bonus;
      } else {
        // Đ, L: tính tiền chính xác không làm tròn, trúng nhân 80
        result = (input * percentage) / 100;
        bonusResult = bonus * 80;
      }

      document.getElementById(`result${row}`).textContent = formatExact(result);
      document.getElementById(`bonusResult${row}`).textContent = formatExact(bonusResult);

      calculateTotal();
      calculateFinalResult();
    }

    function calculateTotal() {
      let total = 0;
      let bonusTotal = 0;
      for (let i = 1; i <= 4; i++) {
        const rEl = document.getElementById(`result${i}`);
        const bEl = document.getElementById(`bonusResult${i}`);
        const rVal = parseFloat(rEl ? rEl.textContent : 0) || 0;
        const bVal = parseFloat(bEl ? bEl.textContent : 0) || 0;
        total += rVal;
        bonusTotal += bVal;
      }

      document.getElementById('total').textContent = formatExact(total);
      document.getElementById('bonusTotal').textContent = formatExact(bonusTotal);
    }

    function calculateFinalResult() {
      const total = parseFloat(document.getElementById('total').textContent) || 0;
      const bonusTotal = parseFloat(document.getElementById('bonusTotal').textContent) || 0;
      const finalResult = total - bonusTotal;

      document.getElementById('finalResult').textContent = formatExact(finalResult);
    }

    // Chuẩn hóa 27 giải
    function normalizeTwentySevenNumbers() {
      var twentySevenNumbersInput = document.getElementById("twentySevenNumbers").value;
      var lines = twentySevenNumbersInput.split("\n");
      var normalizedInput = "";

      for (var i = 0; i < lines.length; i++) {

          numbers.shift();

          .then(function () {

          .catch(function (error) {
            alert("Sao chép thất bại. Vui lòng thử lại.");

      } else {
        var textArea = document.createElement("textarea");
        textArea.value = textToCopy;
        textArea.style.position = "fixed";
        document.body.appendChild(textArea);
        textArea.focus();
        textArea.select();
        try {
          var successful = document.execCommand("copy");
          if (successful) {
            alert("Đã sao chép thành công!");
          } else {
            throw new Error("Sao chép không thành công");
          }
        } catch (error) {
          alert("Sao chép thất bại. Vui lòng thử lại.");

        }
      }

        targetWrapper.style.boxSizing = "border-box";

        const now = new Date();
        const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} - ${String(now.getDate()).padStart(2, '0')}/${String(now.getMonth() + 1).padStart(2, '0')}/${now.getFullYear()}`;

        const rows = [
          { name: "Đ", cuoc: document.getElementById("input1").value, tien: document.getElementById("result1").textContent, trungTien: document.getElementById("bonusResult1").textContent, trung: document.getElementById("bonus1").value },
          { name: "L", cuoc: document.getElementById("input2").value, tien: document.getElementById("result2").textContent, trungTien: document.getElementById("bonusResult2").textContent, trung: document.getElementById("bonus2").value },
          { name: "X", cuoc: document.getElementById("input3").value, tien: document.getElementById("result3").textContent, trungTien: document.getElementById("bonusResult3").textContent, trung: document.getElementById("bonus3").value },
          { name: "C", cuoc: document.getElementById("input4").value, tien: document.getElementById("result4").textContent, trungTien: document.getElementById("bonusResult4").textContent, trung: document.getElementById("bonus4").value }
        ];

        const totalTien = document.getElementById("total").textContent;
        const bonusTotal = document.getElementById("bonusTotal").textContent;
        const finalResult = document.getElementById("finalResult").textContent;

        targetWrapper.innerHTML = `
          <div style="text-align: center; margin-bottom: 12px;">
            <div style="font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #111827;">BẢNG THANH TOÁN CƯỢC</div>
            <div style="font-size: 11px; color: #6b7280; margin-top: 2px;">Thời gian: ${timeStr}</div>
          </div>
          <table style="width: 100%; border-collapse: collapse; border: 1px solid #4b5563; font-size: 13px;">
            <thead>
              <tr style="background-color: #f3f4f6;">
                <th style="border: 1px solid #4b5563; padding: 7px 4px; width: 45px; text-align: center; color: #111827;">Loại</th>
                <th style="border: 1px solid #4b5563; padding: 7px 4px; width: 60px; text-align: center; color: #111827;">Cược</th>
                <th style="border: 1px solid #4b5563; padding: 7px 6px; text-align: right; color: #111827;">Tiền</th>
                <th style="border: 1px solid #4b5563; padding: 7px 6px; text-align: right; color: #111827;">Tiền Trúng</th>
                <th style="border: 1px solid #4b5563; padding: 7px 4px; width: 55px; text-align: center; color: #111827;">Trúng</th>
              </tr>
            </thead>
            <tbody>
              ${rows.map(r => `
                <tr>
                  <td style="border: 1px solid #4b5563; padding: 6px 4px; text-align: center; font-weight: 700; background: #fafafa;">${r.name}</td>
                  <td style="border: 1px solid #4b5563; padding: 6px 4px; text-align: center; font-weight: 600;">${r.cuoc}</td>
                  <td style="border: 1px solid #4b5563; padding: 6px 6px; text-align: right; font-family: Consolas, monospace; font-weight: 600;">${r.tien}</td>
                  <td style="border: 1px solid #4b5563; padding: 6px 6px; text-align: right; font-family: Consolas, monospace; font-weight: 700; color: ${parseFloat(r.trungTien) > 0 ? '#b91c1c' : '#111827'};">${r.trungTien}</td>
                  <td style="border: 1px solid #4b5563; padding: 6px 4px; text-align: center; font-weight: 700; color: ${parseFloat(r.trung) > 0 ? '#b91c1c' : '#111827'};">${r.trung}</td>
                </tr>
              `).join('')}
              <tr style="background-color: #f9fafb; font-weight: 700;">
                <td style="border: 1px solid #4b5563; padding: 6px 4px; text-align: center;">Thầu</td>
                <td style="border: 1px solid #4b5563; padding: 6px 4px;"></td>
                <td style="border: 1px solid #4b5563; padding: 6px 6px; text-align: right; font-family: Consolas, monospace;">${totalTien}</td>
                <td style="border: 1px solid #4b5563; padding: 6px 6px; text-align: right; font-family: Consolas, monospace; color: ${parseFloat(bonusTotal) > 0 ? '#b91c1c' : '#111827'};">${bonusTotal}</td>
                <td style="border: 1px solid #4b5563; padding: 6px 4px;"></td>
              </tr>
              <tr style="background-color: #f3f4f6; font-weight: 800;">
                <td style="border: 1px solid #4b5563; padding: 8px 4px; text-align: center; font-size: 13px;">Tổng thanh toán</td>
                <td style="border: 1px solid #4b5563; padding: 8px 4px;"></td>
                <td colspan="2" style="border: 1px solid #4b5563; padding: 8px 6px; text-align: center; font-size: 16px; font-family: Consolas, monospace; color: ${parseFloat(finalResult) < 0 ? '#b91c1c' : '#111827'};">${finalResult}</td>
                <td style="border: 1px solid #4b5563; padding: 8px 4px;"></td>
              </tr>
            </tbody>
          </table>
        `;

        document.body.appendChild(targetWrapper);

        // Chụp với scale 2 (đảm bảo độ nét cao trên màn hình điện thoại)
        const canvas = await html2canvas(targetWrapper, {
          scale: 2,
          useCORS: true,
          backgroundColor: "#ffffff"
        });

        document.body.removeChild(targetWrapper);

        canvas.toBlob(async function (blob) {
          if (!blob) {
            alert("Không thể tạo ảnh. Vui lòng thử lại!");
            btn.innerHTML = originalText;
            btn.disabled = false;
            return;
          }

          if (navigator.clipboard && window.ClipboardItem) {
            try {
              const item = new ClipboardItem({ "image/png": blob });
              await navigator.clipboard.write([item]);
              alert("✅ Đã sao chép ảnh bảng tính cược!\nBạn chỉ cần mở Zalo và nhấn Ctrl + V để dán gửi ngay.");
            } catch (err) {
              console.warn("ClipboardItem write failed, tải ảnh xuống thay thế:", err);
              downloadImageFallback(blob);
            }
          } else {
            downloadImageFallback(blob);
          }
          btn.innerHTML = originalText;
          btn.disabled = false;
        }, "image/png");

      } catch (error) {
        console.error("Lỗi khi tạo ảnh:", error);
        alert("Có lỗi khi tạo ảnh: " + error.message);
        btn.innerHTML = originalText;
        btn.disabled = false;
      }
    }

    function downloadImageFallback(blob) {
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `Bang_tinh_cuoc_${Date.now()}.png`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      alert("Ảnh bảng tính cược đã được tải về máy của bạn để gửi qua Zalo.");
    }

    // Gán các sự kiện
    document.addEventListener("DOMContentLoaded", function () {
      const normalizeButton = document.getElementById("normalizeButton");
      const numbersInput = document.getElementById("numbers");
      const copyInputListButton = document.getElementById("copyInputListButton");
      const inputList = document.getElementById("inputList");

      // Nút copy ảnh bảng cược gửi Zalo
      const copyTableImageBtn = document.getElementById("copyTableImageBtn");
      if (copyTableImageBtn) {
        copyTableImageBtn.addEventListener("click", copyTableImage);
      }

      // Xóa khoảng trắng đầu dòng khi bấm chuẩn hóa
      normalizeButton.addEventListener("click", function () {
        const inputText = numbersInput.value;
        const lines = inputText.split("\n");
        const normalizedLines = lines.map(line => line.replace(/^\s+/, ""));
        numbersInput.value = normalizedLines.join("\n");
        normalizeTwentySevenNumbers();
      });

      // Sao chép Input List
      copyInputListButton.addEventListener("click", function () {
        const inputListContent = inputList.innerText;
        if (navigator.clipboard && window.isSecureContext) {
          navigator.clipboard.writeText(inputListContent)
            .then(() => alert("Nội dung đã được sao chép thành công!"))
            .catch(() => alert("Sao chép thất bại. Vui lòng thử lại."));
        } else {
          const textArea = document.createElement("textarea");
          textArea.value = inputListContent;
          textArea.style.position = "fixed";
          document.body.appendChild(textArea);
          textArea.focus();
          textArea.select();
          try {
            document.execCommand("copy");
            alert("Nội dung đã được sao chép thành công!");
          } catch (e) {
            alert("Sao chép thất bại.");
          } finally {
            document.body.removeChild(textArea);
          }
        }
      });

      // Ô giữ lại
      const retainNumberInput = document.getElementById("retainNumber");
      retainNumberInput.addEventListener("focus", function () {
        if (retainNumberInput.value === "0") retainNumberInput.value = "";
      });
      retainNumberInput.addEventListener("blur", function () {
        if (retainNumberInput.value.trim() === "") retainNumberInput.value = "0";
      });

      // Nút tính tổng
      var calculateButton = document.getElementById("calculateButton");
      calculateButton.addEventListener("click", function () {
        calculateSum();
        processInputNumbers();
      });

      // Nút sao chép chuyển
      var clipboardButton = document.getElementById("copyButton");
      clipboardButton.addEventListener("click", copyText);

      // Chạy tính toán ban đầu
      calculateSum();
    });
  </script>
</body>

</html>
